<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | VoyageIQ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgba(23, 20, 38, 0.65),
                    rgba(48, 38, 74, 0.45)
                ),
                url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=90");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 22px;

            background: rgba(239, 239, 250, 0.94);
            border: 1px solid #C4B5FD;

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
        }

        .back {
            display: inline-block;
            margin-bottom: 22px;
            color: #6956C8;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: #4935A0;
        }

        h1 {
            color: #252B45;
            margin-bottom: 8px;
            font-size: 29px;
        }

        .subtitle {
            color: #626B85;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;

            border: 1px solid #B9B2E0;
            border-radius: 9px;

            background: #F7F6FC;
            color: #252B45;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6956C8;
            box-shadow: 0 0 0 3px rgba(105, 86, 200, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;

            border: 1px solid #6956C8;
            border-radius: 9px;

            background: transparent;
            color: #6956C8;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6956C8;
            color: white;
            box-shadow: 0 5px 18px rgba(105, 86, 200, 0.3);
        }

        .message {
            color: #B04455;
            background: #FCE8ED;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .bottom {
            margin-top: 22px;
            color: #626B85;
            text-align: center;
        }

        .bottom a {
            color: #6956C8;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <a class="back" href="/">← VoyageIQ Home</a>

        <h1>Create account</h1>

        <p class="subtitle">
            Start planning your next adventure.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/signup">

            <input
                type="text"
                name="name"
                placeholder="Full name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password (8+ characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p class="bottom">
            Already registered?
            <a href="/login">Log in</a>
        </p>

    </div>

</body>
</html>
